{{- if .Values.cim.cimweb.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cnc.fullname" . }}-ldap-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  dn: {{ .Values.cim.ldap.bindDN | b64enc | quote }}
  password: {{ .Values.cim.ldap.bindPassword | b64enc | quote }}
{{- end }}
{{- if and .Values.cim.cimweb.enabled (not .Values.cim.ldap.keySecret.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cnc.fullname" . }}-ldap-encryption-key
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-upgrade, pre-install
    helm.sh/hook-weight: "-20"
type: Opaque
data:
  key: {{ "fLXz3H9yLoe+/xJCMZlVicOXE5fjbpm9zDNOi/tzCs4=" | b64enc | quote }}
{{- end }}