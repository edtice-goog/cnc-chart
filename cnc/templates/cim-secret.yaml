{{- if .Values.cim.cimweb.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cnc.fullname" . }}-cim-secret-key
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook-weight: "-9"
    helm.sh/hook: pre-upgrade, pre-install
type: Opaque
stringData:
  token:  "{{- randAlphaNum 32 | nospace -}}"
{{- end }}