{{- if .Values.cim.cimweb.enabled -}}
{{- /* Made once and kept: a new random value at every upgrade changed Connect's checksum/cim-secret annotation, so every
     helm upgrade restarted Connect, and with several replicas a pod restarted later got a different key. */ -}}
{{- $name := printf "%s-cim-secret-key" (include "cnc.fullname" .) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $token := dig "data" "token" "" $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook-weight: "-9"
    helm.sh/hook: pre-upgrade, pre-install
type: Opaque
data:
  token: {{ $token | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
