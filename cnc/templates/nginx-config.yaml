{{- if .Values.cim.cimweb.enabled -}}
{{- if or (index .Values "scan-services").enabled .Values.cim.cimweb.tlsSidecar.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cnc.fullname" . }}-cim-nginx-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    worker_processes  {{ index .Values.cim.cimweb.tlsSidecar.nginxConfig "worker_processes" | default 1 }};
    events {
        worker_connections  {{ index .Values.cim.cimweb.tlsSidecar.nginxConfig "worker_connections" | default 1024 }};
    }
    http {
        sendfile           on;
        keepalive_timeout  {{ index .Values.cim.cimweb.tlsSidecar.nginxConfig "keepalive_timeout" | default 65 }};
        server {
          listen                    8443 ssl;
          server_name               localhost;
          ssl_certificate           /app/cert/tls.crt;
          ssl_certificate_key       /app/cert/tls.key;
          ssl_protocols             {{ index .Values.cim.cimweb.tlsSidecar.nginxConfig "ssl_protocols" | default "TLSv1.2 TLSv1.3" }};
          ssl_ciphers               {{ index .Values.cim.cimweb.tlsSidecar.nginxConfig "ssl_ciphers" | default "AESGCM:CHACHA20:-kRSA:-aNULL" }};
          ssl_prefer_server_ciphers {{ index .Values.cim.cimweb.tlsSidecar.nginxConfig "ssl_prefer_server_ciphers" | default "on" }};
          ssl_ecdh_curve            {{ index .Values.cim.cimweb.tlsSidecar.nginxConfig "ssl_ecdh_curve" | default "X25519:prime256v1" }};
          ssl_dhparam               /tmp/ssl/ffdhe2048.pem;
          client_max_body_size      {{ index .Values.cim.cimweb.tlsSidecar.nginxConfig "client_max_body_size" | default "100m" }};
          location / {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass      http://127.0.0.1:8080$request_uri;

            proxy_connect_timeout {{ index .Values.cim.cimweb.tlsSidecar.nginxConfig "proxy_connect_timeout" | default "60s" }};
            proxy_read_timeout    {{ index .Values.cim.cimweb.tlsSidecar.nginxConfig "proxy_read_timeout" | default "60s" }};
            proxy_send_timeout    {{ index .Values.cim.cimweb.tlsSidecar.nginxConfig "proxy_send_timeout" | default "60s" }};
            proxy_buffering       {{ index .Values.cim.cimweb.tlsSidecar.nginxConfig "proxy_buffering" | default "off" }};

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
          }
        }
    }
{{- end }}
