{{- if and .Values.cim.gateway.enabled (eq (include "cnc.gateway.isGKE" .) "true") -}}
{{- $fullName := include "cnc.fullname" . -}}
{{- $hc := .Values.cim.gateway.healthCheck | default dict -}}
{{- $requestPath := $hc.requestPath | default "/login/login.htm" -}}
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ $fullName }}-cim-healthcheck
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: ""
    kind: Service
    name: {{ $fullName }}-cim
  default:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 2
    logConfig:
      enabled: false
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: {{ $requestPath | quote }}
        port: 8080
{{- end }}
---
{{- if and .Values.cim.gateway.enabled (eq (include "cnc.gateway.isAWS" .) "true") -}}
{{- $fullName := include "cnc.fullname" . -}}
{{- $hc := .Values.cim.gateway.healthCheck | default dict -}}
{{- $requestPath := $hc.requestPath | default "/login/login.htm" -}}
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: {{ $fullName }}-cim-tg-config
  namespace: {{ .Release.Namespace }}
spec:
  targetReference:
    group: ""
    kind: Service
    name: {{ $fullName }}-cim
  defaultConfiguration:
    targetType: ip
    protocol: HTTP
    healthCheckConfig:
      healthCheckPath: {{ $requestPath | quote }}
      healthCheckInterval: 15
      healthCheckTimeout: 10
      healthyThresholdCount: 2
      unhealthyThresholdCount: 2
      healthCheckProtocol: HTTP
{{- end }}

{{- if and .Values.cim.gateway.enabled (eq (include "cnc.gateway.isAzureALB" .) "true") -}}
{{- $fullName := include "cnc.fullname" . -}}
{{- $hc := .Values.cim.gateway.healthCheck | default dict -}}
{{- $requestPath := $hc.requestPath | default "/login/login.htm" -}}
apiVersion: alb.networking.azure.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ $fullName }}-cim-healthcheck
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: ""
    kind: Service
    name: {{ $fullName }}-cim
  default:
    interval: 15s
    timeout: 10s
    healthyThreshold: 1
    unhealthyThreshold: 2
    port: 8080
    http:
      path: {{ $requestPath | quote }}
      match:
        statusCodes:
          - start: 200
            end: 399
{{- end -}}
