{{- if .Values.monitoring.prometheusRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "triage-suggestion-service.fullname" . }}
  labels:
    {{- include "triage-suggestion-service.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRules.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
  - name: {{ include "triage-suggestion-service.fullname" . }}
    rules:
    {{- toYaml .Values.monitoring.prometheusRules.rules | nindent 4 }}
{{- end }}
