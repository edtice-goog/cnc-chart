{{- if .Values.workerDeployment }}
{{- $workerService := dict }}
{{- range .Values.services }}
  {{- if eq .name "triage-suggestion-service-worker" }}
    {{- $workerService = . }}
  {{- end }}
{{- end }}
{{- if $workerService.name }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $workerService.name }}
  labels:
    {{- include "triage-suggestion-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: {{ $workerService.type | default "ClusterIP" }}
  ports:
  {{- range $workerService.specs }}
  - port: {{ .port }}
    targetPort: {{ .targetPort }}
    protocol: {{ .protocol | default "TCP" }}
    name: {{ .name }}
  {{- end }}
  selector:
    {{- include "triage-suggestion-service.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end }}
{{- end }}
