{{- if (index .Values "triage-vault").enabled }}
{{- $tv := index .Values "triage-vault" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "triage-suggestion-service.fullname" . }}-triage-vault-llm-keys
  labels:
    {{- include "triage-suggestion-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault
type: Opaque
data:
  vault-token: {{ ($tv.server.dev.devRootToken | default "triage-dev-root-token") | b64enc | quote }}
{{- end }}
