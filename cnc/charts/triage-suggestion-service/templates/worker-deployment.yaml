{{- if .Values.workerDeployment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "triage-suggestion-service.fullname" . }}-worker
  labels:
    {{- include "triage-suggestion-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not (and .Values.workerHpa.enabled .Values.workerDeployment.autoscaling.enabled) }}
  replicas: {{ .Values.workerDeployment.replicaCount | default 2 }}
  {{- end }}
  strategy:
    type: {{ .Values.workerDeployment.strategy | default "RollingUpdate" }}
  selector:
    matchLabels:
      {{- include "triage-suggestion-service.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        {{- with .Values.workerDeployment.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "triage-suggestion-service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- else if .Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      {{- end }}
      serviceAccountName: {{ .Values.workerDeployment.serviceAccount | default "triage-suggestion-service" }}
      {{- include "triage-suggestion-service.podSecurityContext" . | nindent 6 }}
      {{- with .Values.schedulerName | default .Values.global.schedulerName }}
      schedulerName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector | default .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations | default .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: worker
        {{- $registry := .Values.workerDeployment.imageRegistry | default .Values.global.imageRegistry }}
        {{- $tagSuffix := .Values.global.imageTagSuffix | default "" }}
        {{- if $registry }}
        image: "{{ $registry }}/{{ .Values.workerDeployment.image }}:{{ .Values.workerDeployment.version | default .Chart.AppVersion }}{{ $tagSuffix }}"
        {{- else }}
        image: "{{ .Values.workerDeployment.image }}:{{ .Values.workerDeployment.version | default .Chart.AppVersion }}{{ $tagSuffix }}"
        {{- end }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
        env:
        {{- range $key, $value := .Values.global.environment }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- range $key, $value := .Values.workerDeployment.environment }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- range $key, $value := .Values.global.envVarsFromSecret }}
        - name: {{ $key }}
          valueFrom:
            secretKeyRef:
              name: {{ $value.name }}
              key: {{ $value.key }}
        {{- end }}
        {{- include "triage-suggestion-service.storageEnvVars" $ | nindent 8 }}
        {{- range $key, $value := .Values.workerDeployment.envVarsFromSecret }}
        - name: {{ $key }}
          valueFrom:
            secretKeyRef:
              name: {{ $value.name }}
              key: {{ $value.key }}
        {{- end }}
        {{- include "triage-suggestion-service.mqEnvVars" $ | nindent 8 }}
        {{- include "triage-suggestion-service.postgresEnvVars" $ | nindent 8 }}
        {{- include "triage-suggestion-service.llmEnvVars" $ | nindent 8 }}
        {{- include "triage-suggestion-service.vaultEnvVars" $ | nindent 8 }}
        {{- include "triage-suggestion-service.llmKeyEncryptionEnvVars" $ | nindent 8 }}
        {{- if .Values.workerDeployment.resources }}
        resources:
          {{- toYaml .Values.workerDeployment.resources | nindent 10 }}
        {{- end }}
        {{- if .Values.volumes.enabled }}
        volumeMounts:
        {{- if .Values.vault.enabled }}
        - name: db-creds
          mountPath: /vault/secrets
        {{- end }}
        {{- range .Values.volumes.configMaps }}
        - name: {{ .name }}
          mountPath: {{ .mountPath }}
          readOnly: true
        {{- end }}
        {{- if .Values.global.extraVolumeMounts }}
        {{- toYaml .Values.global.extraVolumeMounts | nindent 8 }}
        {{- end }}
        {{- include "triage-suggestion-service.llmKeyEncryptionVolumeMounts" $ | nindent 8 }}
        {{- include "triage-suggestion-service.gcsVolumeMounts" $ | nindent 8 }}
        {{- include "triage-suggestion-service.trustStoresVolumeMounts" $ | nindent 8 }}
        {{- include "triage-suggestion-service.mqTlsVolumeMounts" $ | nindent 8 }}
        - name: workdirs
          mountPath: /tmp/workdirs
        - name: artifacts
          mountPath: /tmp/artifacts
        {{- end }}
      {{- if .Values.volumes.enabled }}
      volumes:
      {{- if .Values.vault.enabled }}
      - name: db-creds
        emptyDir: {}
      {{- end }}
      {{- range .Values.volumes.configMaps }}
      - name: {{ .name }}
        configMap:
          name: {{ .name }}
      {{- end }}
      {{- if .Values.global.extraVolumes }}
      {{- toYaml .Values.global.extraVolumes | nindent 6 }}
      {{- end }}
      {{- include "triage-suggestion-service.llmKeyEncryptionVolumes" $ | nindent 6 }}
      {{- include "triage-suggestion-service.gcsVolumes" $ | nindent 6 }}
      {{- include "triage-suggestion-service.trustStoresVolumes" $ | nindent 6 }}
      {{- include "triage-suggestion-service.mqTlsVolumes" $ | nindent 6 }}
      - name: workdirs
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      - name: artifacts
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      {{- end }}
{{- end }}
