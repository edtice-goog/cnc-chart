{{- if .Values.standaloneDeployment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "triage-suggestion-service.fullname" . }}-standalone
  labels:
    {{- include "triage-suggestion-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: standalone
spec:
  {{- if not .Values.standaloneDeployment.autoscaling }}
  replicas: {{ .Values.standaloneDeployment.replicaCount | default 1 }}
  {{- end }}
  strategy:
    type: {{ .Values.standaloneDeployment.strategy | default "RollingUpdate" }}
  selector:
    matchLabels:
      {{- include "triage-suggestion-service.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: standalone
  template:
    metadata:
      annotations:
        {{- with .Values.standaloneDeployment.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "triage-suggestion-service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: standalone
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- else if .Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      {{- end }}
      serviceAccountName: {{ .Values.standaloneDeployment.serviceAccount | default "triage-suggestion-service-standalone" }}
      {{- include "triage-suggestion-service.podSecurityContext" . | nindent 6 }}
      {{- with .Values.schedulerName | default .Values.global.schedulerName }}
      schedulerName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector | default .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations | default .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: standalone
        {{- $registry := .Values.standaloneDeployment.imageRegistry | default .Values.global.imageRegistry }}
        {{- if $registry }}
        image: "{{ $registry }}/{{ .Values.standaloneDeployment.image }}:{{ .Values.standaloneDeployment.version | default .Chart.AppVersion }}"
        {{- else }}
        image: "{{ .Values.standaloneDeployment.image }}:{{ .Values.standaloneDeployment.version | default .Chart.AppVersion }}"
        {{- end }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        {{- range $key, $value := .Values.global.environment }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- range $key, $value := .Values.standaloneDeployment.environment }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- include "triage-suggestion-service.storageEnvVars" $ | nindent 8 }}
        {{- range $key, $value := .Values.global.envVarsFromSecret }}
        - name: {{ $key }}
          valueFrom:
            secretKeyRef:
              name: {{ $value.name }}
              key: {{ $value.key }}
        {{- end }}
        {{- range $key, $value := .Values.standaloneDeployment.envVarsFromSecret }}
        - name: {{ $key }}
          valueFrom:
            secretKeyRef:
              name: {{ $value.name }}
              key: {{ $value.key }}
        {{- end }}
        {{- include "triage-suggestion-service.llmEnvVars" $ | nindent 8 }}
        {{- if .Values.standaloneDeployment.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.standaloneDeployment.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.standaloneDeployment.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.standaloneDeployment.readinessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.standaloneDeployment.resources }}
        resources:
          {{- toYaml .Values.standaloneDeployment.resources | nindent 10 }}
        {{- end }}
        {{- if .Values.volumes.enabled }}
        volumeMounts:
        # Mount persistent volumes for workdirs and artifacts
        {{- if .Values.volumes.pvc.enabled }}
        - name: workdirs
          mountPath: /opt/triage-suggestion-service/workdirs
        - name: artifacts
          mountPath: /opt/triage-suggestion-service/artifacts
        {{- end }}
        # Mount secrets (e.g., LLM API key)
        {{- range .Values.volumes.secrets }}
        - name: {{ .name }}-volume
          mountPath: {{ .mountPath }}
          readOnly: true
        {{- end }}
        # Mount configmaps if any
        {{- range .Values.volumes.configMaps }}
        - name: {{ .name }}
          mountPath: {{ .mountPath }}
          readOnly: true
        {{- end }}
        {{- if .Values.global.extraVolumeMounts }}
        {{- toYaml .Values.global.extraVolumeMounts | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- if .Values.volumes.enabled }}
      volumes:
      # Persistent volume claims for workdirs and artifacts
      {{- if .Values.volumes.pvc.enabled }}
      - name: workdirs
        persistentVolumeClaim:
          claimName: {{ include "triage-suggestion-service.fullname" . }}-workdirs
      - name: artifacts
        persistentVolumeClaim:
          claimName: {{ include "triage-suggestion-service.fullname" . }}-artifacts
      {{- end }}
      # Secrets
      {{- range .Values.volumes.secrets }}
      - name: {{ .name }}-volume
        secret:
          secretName: {{ .name }}
          {{- if .items }}
          items:
          {{- range .items }}
          - key: {{ .key }}
            path: {{ .path }}
          {{- end }}
          {{- end }}
      {{- end }}
      # ConfigMaps
      {{- range .Values.volumes.configMaps }}
      - name: {{ .name }}
        configMap:
          name: {{ .name }}
      {{- end }}
      {{- if .Values.global.extraVolumes }}
      {{- toYaml .Values.global.extraVolumes | nindent 6 }}
      {{- end }}
      {{- end }}
{{- end }}
