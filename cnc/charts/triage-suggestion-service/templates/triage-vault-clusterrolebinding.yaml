{{- if and (index .Values "triage-vault" "enabled") (index .Values "triage-vault" "server" "authDelegator" "enabled") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ index .Values "triage-vault" "fullnameOverride" }}-{{ .Release.Namespace }}-server-binding
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: {{ index .Values "triage-vault" "fullnameOverride" }}
  namespace: {{ .Release.Namespace }}
{{- end }}
