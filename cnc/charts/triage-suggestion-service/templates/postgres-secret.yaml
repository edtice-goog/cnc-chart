{{/*
PostgreSQL credentials secret.
Only created when:
  1. No existingSecret is provided (chart-level, or global)
  2. postgres.host is actually set (otherwise there's nothing useful to store)
When deployed as a CNC subchart, Clark or the umbrella chart sets postgres.host/user/password,
so this secret is auto-generated with the correct values.
*/}}
{{- $pg := .Values.postgres | default dict }}
{{- $globalPg := .Values.global.postgres | default dict }}
{{- $existingSecret := $pg.existingSecret | default $globalPg.existingSecret }}
{{- $host := $pg.host | default $globalPg.host }}
{{- if and (not $existingSecret) $host }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "triage-suggestion-service.fullname" . }}-db-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "triage-suggestion-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  host: {{ $host | quote }}
  port: {{ ($pg.port | default $globalPg.port | default "5432") | quote }}
  username: {{ ($pg.user | default $globalPg.user) | quote }}
  password: {{ ($pg.password | default $globalPg.password) | quote }}
{{- end }}
